# Secret scan (#1917)
# Jobs:
#   1. env-guard     – fail if any .env (except .env.example) is tracked / not gitignored
#   2. gitleaks      – scan the current tree and the commits introduced by this change
#
# Uses the MIT-licensed gitleaks binary directly. The official
# gitleaks/gitleaks-action wrapper requires a paid org license; the binary does not.

name: Secret Scan

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the official checksums file
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  secret-scan:
    name: Gitleaks & .env guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so PR/push rev ranges resolve for gitleaks --log-opts.
          fetch-depth: 0

      - name: Confirm .env is gitignored and untracked
        run: bash scripts/secret-scan.sh --env-guard

      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan current tree
        run: bash scripts/secret-scan.sh

      - name: Scan commits introduced by this change
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          ZERO="0000000000000000000000000000000000000000"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [ -n "${PUSH_BEFORE:-}" ] && [ "$PUSH_BEFORE" != "$ZERO" ]; then
            range="${PUSH_BEFORE}..${PUSH_AFTER}"
          else
            echo "No bounded commit range (new branch or empty before SHA); tree scan already ran."
            exit 0
          fi

          echo "Scanning git range $range"
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --log-opts="$range" \
            --redact \
            --verbose \
            --no-banner \
            --exit-code 1
